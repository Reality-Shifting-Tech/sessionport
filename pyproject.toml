[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sessionport"
version = "0.2.0"
description = "Portable agent sessions: export, carry, and resume work between any coding agent CLI. One command, open format."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Reality Shifting Tech", email = "elias@realityshifting.tech" },
]
keywords = ["ai-agents", "session", "handoff", "claude-code", "codex", "opencode", "context"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "mcp>=1.2,<2",
    "pillow>=10.4",
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]
mcp = [
    "mcp>=1.2,<2",
]

[project.scripts]
sessionport = "sessionport.__main__:main"

[project.urls]
Homepage = "https://github.com/Reality-Shifting-Tech/sessionport"
Repository = "https://github.com/Reality-Shifting-Tech/sessionport"
Source = "https://github.com/Reality-Shifting-Tech/sessionport"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
warn_unused_ignores = true
disallow_untyped_defs = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
